<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parrot Trainer-V1.2</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #0f172a;
    color: white;
  }

  button {
    padding: 10px 16px;
    margin: 6px;
    font-size: 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }

  .record { background: red; color: white; }
  .play { background: green; color: white; }
  .mode { background: #38bdf8; }
  .good { background: gold; color: black; }

  #status { margin: 15px; font-size: 16px; }

  .card {
    background: #1e293b;
    margin: 10px auto;
    padding: 10px;
    width: 80%;
    border-radius: 10px;
  }
</style>
</head>

<body>

<h1>🦜 Parrot Trainer-V1.2</h1>

<button class="mode" onclick="setMode('speech')">Speech Mode</button>
<button class="mode" onclick="setMode('whistle')">Whistle Mode</button>

<br>

<button class="play" onclick="playTarget()">🔊 Play Target</button>
<button class="record" onclick="startRecording()">🎙 Record</button>
<button onclick="stopRecording()">⏹ Stop</button>

<div id="status">Ready</div>

<h2>📚 Recordings</h2>
<div id="list"></div>

<audio id="playback" controls></audio>

<script>
let mode = "speech";
let mediaRecorder;
let audioChunks = [];
let recordedBlob = null;

let db;

// -------------------- DB INIT --------------------
const request = indexedDB.open("ParrotTrainerDB", 1);

request.onupgradeneeded = function(e) {
  db = e.target.result;
  const store = db.createObjectStore("recordings", { keyPath: "id" });
  store.createIndex("mode", "mode", { unique: false });
};

request.onsuccess = function(e) {
  db = e.target.result;
  loadRecordings();
};

// -------------------- MODE --------------------
function setMode(m) {
  mode = m;
  document.getElementById("status").innerText = "Mode: " + mode;
}

// -------------------- TARGET SOUND --------------------
function playTarget() {
  if (mode === "speech") {
    const utter = new SpeechSynthesisUtterance("boker tov");
    speechSynthesis.speak(utter);
  } else {
    playWhistle();
  }
}

function playWhistle() {
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.type = "sine";
  osc.frequency.setValueAtTime(1500, ctx.currentTime);
  osc.frequency.linearRampToValueAtTime(2500, ctx.currentTime + 0.3);
  osc.frequency.linearRampToValueAtTime(1800, ctx.currentTime + 0.6);

  gain.gain.setValueAtTime(0.2, ctx.currentTime);

  osc.start();
  osc.stop(ctx.currentTime + 1);
}

// -------------------- RECORDING --------------------
async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];

  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

  mediaRecorder.onstop = async () => {
    recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });

    const url = URL.createObjectURL(recordedBlob);
    document.getElementById("playback").src = url;

    const id = Date.now().toString();

    const record = {
      id,
      mode,
      blob: recordedBlob,
      timestamp: Date.now(),
      good: false
    };

    saveToDB(record);
    analyzeAudio(record);
  };

  mediaRecorder.start();
  document.getElementById("status").innerText = "Recording...";
}

function stopRecording() {
  if (mediaRecorder) {
    mediaRecorder.stop();
    document.getElementById("status").innerText = "Processing...";
  }
}

// -------------------- SIMPLE ANALYSIS --------------------
function analyzeAudio(record) {
  const reader = new FileReader();

  reader.onload = function() {
    const arrayBuffer = reader.result;
    const ctx = new AudioContext();

    ctx.decodeAudioData(arrayBuffer, buffer => {
      const data = buffer.getChannelData(0);

      let energy = 0;
      for (let i = 0; i < data.length; i++) {
        energy += Math.abs(data[i]);
      }

      energy = energy / data.length;

      if (energy > 0.02) {
        document.getElementById("status").innerText = "✅ Good attempt!";
        reward();
      } else {
        document.getElementById("status").innerText = "⚠️ Too weak";
      }

      loadRecordings();
    });
  };

  reader.readAsArrayBuffer(record.blob);
}

// -------------------- REWARD --------------------
function reward() {
  document.body.style.background = "green";
  setTimeout(() => {
    document.body.style.background = "#0f172a";
  }, 300);

  const ctx = new AudioContext();
  const osc = ctx.createOscillator();

  osc.connect(ctx.destination);
  osc.frequency.value = 800;
  osc.start();
  osc.stop(ctx.currentTime + 0.1);
}

// -------------------- DB SAVE --------------------
function saveToDB(record) {
  const tx = db.transaction("recordings", "readwrite");
  const store = tx.objectStore("recordings");
  store.put(record);
}

// -------------------- LOAD LIST --------------------
function loadRecordings() {
  const tx = db.transaction("recordings", "readonly");
  const store = tx.objectStore("recordings");

  const req = store.getAll();

  req.onsuccess = () => {
    const list = document.getElementById("list");
    list.innerHTML = ""; // IMPORTANT

    const seen = new Set();

    req.result.forEach(r => {
      if (seen.has(r.id)) return; // prevent duplicates
      seen.add(r.id);

      const url = URL.createObjectURL(r.blob);

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <b>${r.mode}</b><br>
        <audio controls src="${url}"></audio><br>
        <button onclick="markGood('${r.id}')">⭐ Mark Good</button>
      `;

      list.appendChild(div);
    });
  };
}

// -------------------- MARK GOOD --------------------
function markGood(id) {
  const tx = db.transaction("recordings", "readwrite");
  const store = tx.objectStore("recordings");

  const req = store.get(id);

  req.onsuccess = () => {
    const record = req.result;
    record.good = true;
    store.put(record);

    document.getElementById("status").innerText = "⭐ Saved as good sample";
  };
}
</script>

</body>
</html>
